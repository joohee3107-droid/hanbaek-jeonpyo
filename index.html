<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>자동전표 프로그램</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    margin: 0;
    background: #f5f6f8;
    color: #222;
  }
  header {
    background: #1f2937;
    color: #fff;
    padding: 16px 24px;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 12px; color: #9ca3af; }
  main { max-width: 640px; margin: 40px auto; padding: 0 16px; }
  .voucher-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .voucher-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 16px 20px;
    font-size: 15px;
    text-decoration: none;
    color: #111827;
  }
  .voucher-item:hover { border-color: #2563eb; }
  .voucher-item.disabled {
    color: #9ca3af;
    cursor: not-allowed;
    pointer-events: none;
  }
  .voucher-item .status {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #dcfce7;
    color: #166534;
  }
  .voucher-item.disabled .status {
    background: #f3f4f6;
    color: #9ca3af;
  }
</style>
</head>
<body>
<header>
  <h1>자동전표 프로그램</h1>
  <p>전표 종류를 선택하세요.주희가 만든 프로그램 🚀</p>
</header>
<main>
  <ul class="voucher-list">
    <li><a class="voucher-item" href="autotransfer.html">자동이체 자동전표</a></li>
    <li><a class="voucher-item" href="yeollingumae.html">열린구매 자동전표</a></li>
  </ul>
</main>
</body>
</html>
